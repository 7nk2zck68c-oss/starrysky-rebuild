<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Today's Starry Sky - Gyro Rebuild</title>
<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;}
body{position:fixed;inset:0;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
#project{position:absolute;inset:0;width:100%;height:100%;background:#000;}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;color:#fff;background:rgba(0,0,0,.78);font-size:15px;padding:11px 15px;border:1px solid rgba(255,255,255,.16);border-radius:12px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#error{display:none;position:absolute;inset:0;z-index:60;background:#111;color:#fff;padding:24px;box-sizing:border-box;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:auto;}
#toolbar{position:fixed;z-index:40;top:calc(var(--safe-top) + 8px);right:calc(var(--safe-right) + 8px);display:flex;align-items:center;gap:7px;max-width:calc(100vw - var(--safe-left) - var(--safe-right) - 16px);pointer-events:auto;}
.segment{display:flex;padding:3px;background:rgba(12,15,22,.78);border:1px solid rgba(255,255,255,.18);border-radius:12px;box-shadow:0 3px 16px rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.ui-btn{appearance:none;-webkit-appearance:none;border:0;color:#fff;background:transparent;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:36px;padding:0 11px;border-radius:9px;white-space:nowrap;touch-action:manipulation;}
.ui-btn:active{transform:scale(.97)}
.ui-btn.active{background:rgba(255,255,255,.2);}
#locationBtn{background:rgba(12,15,22,.78);border:1px solid rgba(255,255,255,.18);box-shadow:0 3px 16px rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#locationPanel{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,390px);padding:17px;background:rgba(17,20,28,.96);border:1px solid rgba(255,255,255,.18);border-radius:17px;color:#fff;box-shadow:0 18px 55px rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#locationPanel[hidden]{display:none}
.panel-title{font-size:18px;font-weight:700;margin:0 0 5px}
.panel-note{font-size:12px;line-height:1.45;color:rgba(255,255,255,.72);margin:0 0 13px}
.coord-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.coord-grid label{font-size:12px;color:rgba(255,255,255,.72)}
.coord-grid input{width:100%;margin-top:5px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#080a0f;color:#fff;font:16px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;user-select:text;-webkit-user-select:text;}
.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel-actions .ui-btn{background:#262c38;border:1px solid rgba(255,255,255,.12);min-height:42px}
.panel-actions .primary{background:#1769e0}
#closeLocation{grid-column:1 / -1;background:transparent}
#toast{position:fixed;z-index:55;left:50%;bottom:calc(var(--safe-bottom) + 16px);transform:translateX(-50%);max-width:min(88vw,520px);padding:9px 13px;border-radius:11px;background:rgba(15,18,24,.88);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#toast.show{opacity:1}
@media (max-width:520px){
  #toolbar{left:calc(var(--safe-left) + 7px);right:calc(var(--safe-right) + 7px);justify-content:space-between;gap:5px;}
  .ui-btn{min-height:34px;padding:0 9px;font-size:12px}
  #locationBtn{margin-left:auto}
}
@media (max-width:360px){#locationBtn .long-label{display:none}}

#gyroView{position:fixed;inset:0;z-index:25;background:#02050b;overflow:hidden;}
#gyroView[hidden]{display:none}
#gyroSky{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
#gyroCross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;opacity:.42;}
#gyroCross:before,#gyroCross:after{content:"";position:absolute;background:#fff;}
#gyroCross:before{width:20px;height:1px;top:9.5px;left:0}
#gyroCross:after{height:20px;width:1px;left:9.5px;top:0}
#gyroHud{position:absolute;z-index:26;left:calc(var(--safe-left) + 9px);right:calc(var(--safe-right) + 9px);bottom:calc(var(--safe-bottom) + 10px);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;}
.gyro-pill{max-width:min(94vw,680px);padding:6px 10px;border-radius:10px;background:rgba(5,10,20,.7);border:1px solid rgba(255,255,255,.11);color:#dce5f3;font-size:11px;line-height:1.3;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#gyroBtn{background:rgba(12,15,22,.78);border:1px solid rgba(255,255,255,.18);box-shadow:0 3px 16px rgba(0,0,0,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#gyroBtn.active{background:#1769e0;border-color:rgba(255,255,255,.32);}
@media (max-width:430px){#toolbar{gap:4px}.ui-btn{padding:0 8px}.mode-label{display:none}}

</style>
</head>
<body data-build="v6-gyro-compass-lock">
<div id="project"></div>
<div id="status">Scratch原本を読み込み中…</div>
<div id="error"></div>

<div id="toolbar" aria-label="表示設定">
  <div class="segment" aria-label="表示モード">
    <button id="smartBtn" class="ui-btn" type="button">📱 スマホ</button>
    <button id="pcBtn" class="ui-btn" type="button">🖥 PC</button>
  </div>
  <button id="gyroBtn" class="ui-btn" type="button" aria-pressed="false">🧭 <span class="mode-label">ジャイロ</span></button>
  <button id="locationBtn" class="ui-btn" type="button">📍 <span class="long-label">現在地</span></button>
</div>

<div id="locationPanel" hidden role="dialog" aria-modal="true" aria-labelledby="locationTitle">
  <h2 id="locationTitle" class="panel-title">観測地点</h2>
  <p id="locationStatus" class="panel-note">起動時は端末の現在地を使用します。必要な場合だけ変更してください。</p>
  <div class="coord-grid">
    <label>緯度 Latitude<input id="latInput" type="number" inputmode="decimal" step="0.000001" min="-90" max="90"></label>
    <label>経度 Longitude<input id="lonInput" type="number" inputmode="decimal" step="0.000001" min="-180" max="180"></label>
  </div>
  <div class="panel-actions">
    <button id="gpsBtn" class="ui-btn" type="button">📍 現在地を取得</button>
    <button id="applyLocation" class="ui-btn primary" type="button">この位置を使う</button>
    <button id="closeLocation" class="ui-btn" type="button">閉じる</button>
  </div>
</div>
<div id="toast"></div>
<div id="gyroView" hidden aria-label="ジャイロ星空表示">
  <canvas id="gyroSky"></canvas>
  <div id="gyroCross"></div>
  <div id="gyroHud">
    <div id="gyroInfo" class="gyro-pill">カメラ方向を取得中…</div>
    <div id="gyroStatus" class="gyro-pill">ジャイロボタンを押すと方向センサーを開始します</div>
  </div>
</div>

const VAR_IDS = Object.freeze({
  longitude: 'w=PmdFgOERQ2,[ZwXuTd-long-',
  latitude: 'w=PmdFgOERQ2,[ZwXuTd-lat-',
  ok: 'KJ?Amdv:WEMP-%yl3*?$',
  mode: 'WY$3i6^2jLCR|nbzMzOM'
});
const STORAGE_KEYS = Object.freeze({lat:'starrySky.latitude', lon:'starrySky.longitude', mode:'starrySky.mode'});
let gyroMode = false;
let preGyroMode = 1;
let app = null;
let toastTimer = 0;

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function fail(err) {
  console.error(err);
  const status = document.getElementById('status');
  if (status) status.style.display = 'none';
  const box = document.getElementById('error');
  box.style.display = 'block';
  box.textContent = '起動できませんでした。\n\nインターネット接続を確認してください（Scratch互換ランタイムの読み込みに必要です）。\n\n詳細: ' + (err && err.message ? err.message : String(err));
}
function stage() { return app && app.vm && app.vm.runtime ? app.vm.runtime.getTargetForStage() : null; }
function stageVar(id) { const s = stage(); return s && s.variables ? s.variables[id] : null; }
function setVar(id, value) { const v = stageVar(id); if (v) v.value = value; }
function getVar(id) { const v = stageVar(id); return v ? v.value : null; }
function toast(message, ms=2400) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function validLatLon(lat, lon) { return Number.isFinite(lat) && Number.isFinite(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180; }
function saveLocation(lat, lon) {
  try { localStorage.setItem(STORAGE_KEYS.lat, String(lat)); localStorage.setItem(STORAGE_KEYS.lon, String(lon)); } catch (_) {}
}
function savedLocation() {
  try {
    const rawLat = localStorage.getItem(STORAGE_KEYS.lat), rawLon = localStorage.getItem(STORAGE_KEYS.lon);
    if (rawLat === null || rawLon === null) return null;
    const lat=Number(rawLat), lon=Number(rawLon);
    return validLatLon(lat,lon) ? {lat,lon} : null;
  } catch (_) { return null; }
}
function updateLocationInputs(lat, lon) {
  document.getElementById('latInput').value = Number(lat).toFixed(6);
  document.getElementById('lonInput').value = Number(lon).toFixed(6);
}
function applyLocation(lat, lon, {save=true, message='観測地点を変更しました'}={}) {
  lat = Number(lat); lon = Number(lon);
  if (!validLatLon(lat,lon)) throw new Error('緯度・経度の値が正しくありません');
  setVar(VAR_IDS.ok, 0);
  setVar(VAR_IDS.longitude, lon);
  setVar(VAR_IDS.latitude, lat);
  setVar(VAR_IDS.ok, 1);
  if (save) saveLocation(lat,lon);
  updateLocationInputs(lat,lon);
  if (window.GyroSky) window.GyroSky.setLocation(lat,lon);
  const s = stage();
  if (s && s.runtime && s.runtime.requestRedraw) s.runtime.requestRedraw();
  if (message) toast(message);
}
function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('このブラウザは現在地取得に対応していません'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy}),
      e => reject(new Error(e && e.message ? e.message : '現在地を取得できませんでした')),
      {enableHighAccuracy:true, timeout:9000, maximumAge:300000}
    );
  });
}
function detectedMode() {
  try { const saved = localStorage.getItem(STORAGE_KEYS.mode); if (saved === '0' || saved === '1') return Number(saved); } catch (_) {}
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const mobileUA = /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent || '');
  return (coarse || mobileUA || Math.min(innerWidth, innerHeight) < 700) ? 1 : 0;
}
function applyMode(mode, {save=true, announce=false}={}) {
  mode = Number(mode) === 1 ? 1 : 0;
  setVar(VAR_IDS.mode, mode);
  document.getElementById('smartBtn').classList.toggle('active', mode === 1);
  document.getElementById('pcBtn').classList.toggle('active', mode === 0);
  document.getElementById('smartBtn').setAttribute('aria-pressed', mode === 1 ? 'true' : 'false');
  document.getElementById('pcBtn').setAttribute('aria-pressed', mode === 0 ? 'true' : 'false');
  if (save) try { localStorage.setItem(STORAGE_KEYS.mode, String(mode)); } catch (_) {}
  if (app && app.relayout) requestAnimationFrame(() => app.relayout());
  if (announce) toast(mode === 1 ? 'スマホモード' : 'パソコンモード');
}
async function setGyroMode(on) {
  on = !!on;
  const btn = document.getElementById('gyroBtn');
  const view = document.getElementById('gyroView');
  const project = document.getElementById('project');
  if (on) {
    if (gyroMode) return;
    if (!window.GyroSky) { toast('ジャイロ表示を初期化できませんでした', 3200); return; }
    preGyroMode = Number(getVar(VAR_IDS.mode)) === 0 ? 0 : 1;
    const lat = Number(getVar(VAR_IDS.latitude)), lon = Number(getVar(VAR_IDS.longitude));
    if (validLatLon(lat,lon)) window.GyroSky.setLocation(lat,lon);
    // iOS requires requestPermission() to run directly from this button tap.
    view.hidden = false;
    project.style.visibility = 'hidden';
    window.GyroSky.refresh();
    const ok = await window.GyroSky.start();
    if (!ok) {
      view.hidden = true; project.style.visibility = '';
      btn.classList.remove('active'); btn.setAttribute('aria-pressed','false');
      toast('方向センサーを開始できませんでした。Safariのモーション許可を確認してください。', 4200);
      return;
    }
    gyroMode = true;
    btn.classList.add('active'); btn.setAttribute('aria-pressed','true');
    document.getElementById('smartBtn').classList.remove('active');
    document.getElementById('pcBtn').classList.remove('active');
    toast('ジャイロモード：背面カメラ方向を3D姿勢で追従します', 3000);
  } else {
    if (window.GyroSky) window.GyroSky.stop();
    gyroMode = false; view.hidden = true; project.style.visibility = '';
    btn.classList.remove('active'); btn.setAttribute('aria-pressed','false');
    applyMode(preGyroMode, {save:false, announce:false});
    if (app && app.relayout) requestAnimationFrame(() => app.relayout());
    toast('ジャイロモードを終了しました');
  }
}
function toggleGyroMode() { return setGyroMode(!gyroMode); }
function openLocationPanel() {
  const lat = Number(getVar(VAR_IDS.latitude)), lon = Number(getVar(VAR_IDS.longitude));
  if (validLatLon(lat,lon)) updateLocationInputs(lat,lon);
  document.getElementById('locationPanel').hidden = false;
}
function closeLocationPanel() { document.getElementById('locationPanel').hidden = true; }
function wireUI() {
  document.getElementById('smartBtn').addEventListener('click', async () => { if (gyroMode) await setGyroMode(false); applyMode(1, {announce:true}); });
  document.getElementById('pcBtn').addEventListener('click', async () => { if (gyroMode) await setGyroMode(false); applyMode(0, {announce:true}); });
  document.getElementById('gyroBtn').addEventListener('click', toggleGyroMode);
  document.getElementById('locationBtn').addEventListener('click', openLocationPanel);
  document.getElementById('closeLocation').addEventListener('click', closeLocationPanel);
  document.getElementById('applyLocation').addEventListener('click', () => {
    try { applyLocation(document.getElementById('latInput').value, document.getElementById('lonInput').value); closeLocationPanel(); }
    catch (e) { toast(e.message || String(e), 3200); }
  });
  document.getElementById('gpsBtn').addEventListener('click', async () => {
    const btn = document.getElementById('gpsBtn');
    const old = btn.textContent; btn.disabled = true; btn.textContent = '取得中…';
    try { const p = await getCurrentPosition(); applyLocation(p.lat,p.lon,{message:'現在地に更新しました'}); document.getElementById('locationStatus').textContent = `現在地を使用中（精度 約${Math.round(p.accuracy)}m）`; }

async function resolveStartupLocation(status) {

}

<script>
/* Gyro sky renderer v6: locked compass calibration + continuous 3-D gyro + adaptive labels. */
(() => {
"use strict";

const canvas = document.getElementById("gyroSky");
const ctx = canvas.getContext("2d", {alpha:false});
const info = document.getElementById("gyroInfo");
const status = document.getElementById("gyroStatus");
const startBtn = {textContent:""};

let W=0,H=0,DPR=1;
let lat=35.0, lon=135.0;
let heading=180, pitch=25;
// Full rear-camera orientation in the local Earth frame.
// x=east, y=north, z=up.
let cameraBasis=null;
// iOS compass is used only during a short start-up calibration.  Once locked,
// the offset is NEVER recomputed while the phone is moving.  This prevents
// azimuth flips when the phone is tilted toward the zenith.
let compassAlphaOffset=null;
let compassCalibration=[];
let compassCalibrationStarted=0;
let sensorSource="";
let sensorActive=false;
let enabled=false;
let dirty=true;
let lastDraw=0;
const SHORT_AXIS_FOV=60; // one focal length; no aspect-ratio distortion

// Accept several possible data.js formats and normalize them.
function findArray(candidates) {
  for (const n of candidates) if (Array.isArray(window[n])) return window[n];
  return null;
}
function globalArrays() {
  const out={};
  for (const k of Object.keys(window)) {
    try { if (Array.isArray(window[k]) && window[k].length>100) out[k]=window[k]; } catch(_){}
  }
  return out;
}
const globals=globalArrays();

function decDDMMToDeg(v){
  const x=Number(v)||0;
  const sign=x<0?-1:1;
  const a=Math.abs(x);
  // Scratch catalog ALWAYS stores declination as DDMM:
  //  8915 = +89°15', 624 = +6°24', -49 = -0°49'.
  // The old code wrongly treated values below 100 as whole degrees.
  const d=Math.floor(a/100);
  const m=a-d*100;
  return sign*(d+m/60);
}

function parseStars(){
  // Preferred formats.
  for (const key of ["STARS","stars","starData","STAR_DATA"]) {
    const a=window[key];
    if(Array.isArray(a) && a.length && typeof a[0]==="object") {
      return a.map((s,i)=>({
        ra: +((s.raDeg ?? s.ra ?? s.RA) || 0),
        dec: decDDMMToDeg((s.dec ?? s.Dec ?? s.DEC) || 0),
        mag:+((s.mag ?? s.magnitude ?? 5) || 5),
        ja:String(s.ja ?? s.nameJa ?? ""),
        en:String(s.en ?? s.nameEn ?? s.name ?? ""),
        name:String(s.en ?? s.nameEn ?? s.name ?? s.ja ?? s.nameJa ?? "")
      }));
    }
  }

  // Arrays extracted from Scratch data.js.
  const keys=Object.keys(globals);
  const raKey=keys.find(k=>/stars?.*ra/i.test(k));
  const decKey=keys.find(k=>/stars?.*dec/i.test(k));
  const magKey=keys.find(k=>/stars?.*(mag|magnitude)/i.test(k));
  const nameKey=keys.find(k=>/stars?.*name/i.test(k));
  if(raKey && decKey){
    const R=globals[raKey], D=globals[decKey], M=magKey?globals[magKey]:[], N=nameKey?globals[nameKey]:[];
    return R.map((v,i)=>{
      let x=+v||0;
      // Scratch catalog stores RA in HHMM form in the original project.
      if(x<=2400){
        const iv=Math.round(x), hh=Math.floor(iv/100), mm=iv%100;

      }
      return {ra:x,dec:+D[i]||0,mag:+M[i]||5,name:String(N[i]||"")};
    });
  }

  // Last-resort: look for one large array of objects.
  for(const a of Object.values(globals)){
    if(Array.isArray(a)&&a.length>500&&a[0]&&typeof a[0]==="object"){
      return a.map((s)=>({ra:+s.ra||0,dec:+s.dec||0,mag:+s.mag||5,name:String(s.name||"")}));
    }
  }
  return [];
}

function parseLines(){
  if(Array.isArray(window.CONST_LINES)){
    return window.CONST_LINES.map(q=>({
      ra1:+q[0]||0, dec1:decDDMMToDeg(q[1]),
      ra2:+q[2]||0, dec2:decDDMMToDeg(q[3])
    }));
  }
  for(const key of ["CONSTELLATIONS","constellationLines","LINES","lines"]){
    const a=window[key];
    if(Array.isArray(a)&&a.length&&typeof a[0]==="object"){

        ra1:+(q.ra1??q.startRA??0), dec1:decDDMMToDeg(q.dec1??q.startDec??0),

function toRADeg(v){
  let x=+v||0;

// original constellation data without changing any gyro/orientation math.
function constellationNameOfStar(s){
  let ja=String(s.ja||"");
  const i=ja.indexOf("座");
  if(i<0) return "";

    let g=groups.get(name);
    if(!g){g={name,x:0,y:0,z:0,count:0};groups.set(name,g);}
    const ra=deg2rad(s.ra), de=deg2rad(s.dec);
    const cd=Math.cos(de);
    // Equal weighting keeps the label near the geometric middle of each
    // catalog constellation rather than pulling it toward one bright star.
    g.x+=cd*Math.cos(ra); g.y+=cd*Math.sin(ra); g.z+=Math.sin(de); g.count++;
  }
  const out=[];
  for(const g of groups.values()){
    const r=Math.hypot(g.x,g.y,g.z);
    if(!r || g.count<1) continue;
    const x=g.x/r,y=g.y/r,z=g.z/r;
    out.push({
      name:g.name,
      ra:norm360(rad2deg(Math.atan2(y,x))),
      dec:rad2deg(Math.asin(Math.max(-1,Math.min(1,z)))),
      count:g.count
    });
  }
  return out;
}
const constellationCenters=buildConstellationCenters(stars);

function isPolaris(s){
  return (s.en||"").includes("ポラリス") ||
         (s.ja||"").includes("こぐま座α星") ||
         (Math.abs(s.ra-37.75)<0.3 && Math.abs(s.dec-89.25)<0.3);
}
const BIG_DIPPER_NAMES=["ドゥベー","メラク","フェクダ","メグレズ","アリオト","ミザール","アルカイド"];
function isBigDipper(s){ return BIG_DIPPER_NAMES.some(n=>(s.en||"").includes(n)); }

function properStarName(s){
  const n=String(s.en||"").trim();
  if(!n) return "";
  if(isPolaris(s)) return "北極星（ポラリス）";
  return n;
}

function rectsOverlap(a,b,pad=3){
  return !(a.x+a.w+pad < b.x || b.x+b.w+pad < a.x ||
           a.y+a.h+pad < b.y || b.y+b.h+pad < a.y);
}

function reserveDomRect(occupied,el,pad=4){
  if(!el || el.hidden) return;
  const r=el.getBoundingClientRect();
  if(r.width<=0 || r.height<=0) return;
  const c=canvas.getBoundingClientRect();
  occupied.push({
    x:r.left-c.left-pad,
    y:r.top-c.top-pad,
    w:r.width+pad*2,
    h:r.height+pad*2
  });
}

function drawStarLabelCandidate(c,occupied){
  const bright=c.s.mag<=2.05;
  const pol=isPolaris(c.s);
  const text=properStarName(c.s);
  if(!text) return false;

  const fontSize=pol?13:(bright?12:11);
  const weight=(pol || c.s.mag<=1.2)?600:500;
  ctx.font=`${weight} ${fontSize}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
  const tw=Math.ceil(ctx.measureText(text).width);
  const th=fontSize+4;
  const offsets=[
    [8,-th-2], [8,5], [-tw-8,-th-2], [-tw-8,5],
    [-Math.round(tw/2),-th-8], [-Math.round(tw/2),10]
  ];

  for(const [dx,dy] of offsets){
    const box={x:c.p.x+dx-2,y:c.p.y+dy-2,w:tw+4,h:th+4};
    if(box.x<3 || box.y<3 || box.x+box.w>W-3 || box.y+box.h>H-3) continue;
    if(occupied.some(o=>rectsOverlap(box,o,2))) continue;

    ctx.save();
    ctx.font=`${weight} ${fontSize}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textBaseline="top";
    ctx.lineJoin="round";
    ctx.lineWidth=3;
    ctx.strokeStyle="rgba(2,5,11,.88)";
    ctx.strokeText(text,c.p.x+dx,c.p.y+dy);
    ctx.fillStyle=pol?"#ffffff":(bright?"rgba(244,248,255,.94)":"rgba(218,228,244,.82)");
    ctx.fillText(text,c.p.x+dx,c.p.y+dy);
    ctx.restore();
    occupied.push(box);
    return true;
  }
  return false;
}

function drawAdaptiveStarLabels(candidates,planetLabelRects){
  // All proper names down to 3rd magnitude are candidates. 1st/2nd-magnitude
  // stars have priority; 2-3 mag names are added only while screen density allows.
  const named=candidates
    .filter(c=>properStarName(c.s) && c.s.mag<=3.05)
    .sort((a,b)=>{
      const pa=isPolaris(a.s)?-100:a.s.mag;
      const pb=isPolaris(b.s)?-100:b.s.mag;
      if(pa!==pb) return pa-pb;
      const da=(a.p.x-W/2)**2+(a.p.y-H/2)**2;
      const db=(b.p.x-W/2)**2+(b.p.y-H/2)**2;
      return da-db;
    });

  const occupied=[...(planetLabelRects||[])];
  reserveDomRect(occupied,document.getElementById("toolbar"),5);
  reserveDomRect(occupied,document.getElementById("info"),4);
  reserveDomRect(occupied,document.getElementById("debug"),4);

  const bright=named.filter(c=>c.s.mag<=2.05);
  const faint=named.filter(c=>c.s.mag>2.05);
  // Portrait phones: about 16 labels; larger screens may use more.
  const budget=Math.max(14,Math.min(30,Math.round((W*H)/24000)));
  let placed=0;

  // Bright named stars first. Their labels are attempted regardless of budget.
  for(const c of bright){
    if(drawStarLabelCandidate(c,occupied)) placed++;
  }
  // Fill remaining room with 2-3 mag stars.
  for(const c of faint){
    if(placed>=budget) break;
    if(drawStarLabelCandidate(c,occupied)) placed++;
  }
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  // Measure the element Safari is actually compositing. This avoids a mismatch
  // between innerHeight and the fixed viewport while the browser chrome moves.
  const rect=canvas.getBoundingClientRect();
  W=Math.max(1,Math.round(rect.width || document.documentElement.clientWidth || window.innerWidth));
  H=Math.max(1,Math.round(rect.height || document.documentElement.clientHeight || window.innerHeight));

  const bw=Math.max(1,Math.round(W*DPR));
  const bh=Math.max(1,Math.round(H*DPR));
  if(canvas.width!==bw || canvas.height!==bh){
    canvas.width=bw;
    canvas.height=bh;
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  dirty=true;
}
addEventListener("resize",resize,{passive:true}); resize();

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",()=>{ resize(); },{passive:true});
}
window.addEventListener("pageshow",()=>{
  // Safari may restore the page from the back/forward cache with old compositor
  // contents. Force a fresh backing store and a single clean redraw.
  resize();
  dirty=true;
},{passive:true});
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    resize();
    dirty=true;
  }
});

function norm360(x){x%=360;return x<0?x+360:x;}
function jd(date){return 2440587.5+date.getTime()/86400000;}
function gst(date){
  const J=jd(date), T=(J-2451545)/36525;
  return norm360(280.46061837+360.98564736629*(J-2451545)+0.000387933*T*T-T*T*T/38710000);
}
function horizontal(ra,dec,date){
  const lst=norm360(gst(date)+lon), Hh=(lst-ra)*Math.PI/180;
  const de=dec*Math.PI/180, la=lat*Math.PI/180;
  const sa=Math.sin(de)*Math.sin(la)+Math.cos(de)*Math.cos(la)*Math.cos(Hh);
  const alt=Math.asin(Math.max(-1,Math.min(1,sa)));
  const y=Math.sin(Hh);
  const x=Math.cos(Hh)*Math.sin(la)-Math.tan(de)*Math.cos(la);
  let az=Math.atan2(y,x)+Math.PI;
  return {az:norm360(az*180/Math.PI),alt:alt*180/Math.PI};
}
function skyVec(az,alt){
  const A=az*Math.PI/180, h=alt*Math.PI/180;
  const ch=Math.cos(h);
  return {x:ch*Math.sin(A), y:ch*Math.cos(A), z:Math.sin(h)};
}
function dot3(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}

// Perspective projection on the rear-camera tangent plane.
// v4 uses the full 3-D camera basis, including roll and upside-down poses.
// Earth frame: x=east, y=north, z=up.
// This remains well-behaved at the zenith; unlike azimuth/elevation subtraction,
// there is no singularity when altitude approaches +90°.
function projectRaw(az,alt){
  let forward,right,up;

  if(cameraBasis){
    ({forward,right,up}=cameraBasis);
  }else{
    // Fallback before sensor data arrives.
    const A=heading*Math.PI/180, h=pitch*Math.PI/180;
    const ca=Math.cos(A), sa=Math.sin(A), ch=Math.cos(h), sh=Math.sin(h);
    forward={x:ch*sa, y:ch*ca, z:sh};
    right={x:ca, y:-sa, z:0};
    up={x:-sh*sa, y:-sh*ca, z:ch};
  }

  const t=skyVec(az,alt);
  const cx=dot3(t,right);
  const cy=dot3(t,up);
  const cz=dot3(t,forward);

  if(cz<=1e-5) return {x:NaN,y:NaN,front:false,cz};
  // One focal length for both axes. The previous build used unrelated X/Y FOVs,
  // which stretched constellations on a tall iPhone screen.
  const focal=(Math.min(W,H)*0.5)/Math.tan(deg2rad(SHORT_AXIS_FOV*0.5));
  return {
    x:W/2+(cx/cz)*focal,
    y:H/2-(cy/cz)*focal,
    front:true,cz
  };
}
function project(az,alt){
  const p=projectRaw(az,alt);
  if(!p.front || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return null;
  if(p.x < -40 || p.x > W+40 || p.y < -40 || p.y > H+40) return null;
  return p;
}

// ---------------------------------------------------------------------------
// Moon + planets
// Ported from the user's original Scratch project ("Today's Starry sky remix").
// The orbital elements and perturbation terms below intentionally follow that
// project rather than replacing it with a different ephemeris model.
// Epoch variable d = days since 2000 Jan 0.0 (JD 2451543.5).
// ---------------------------------------------------------------------------
function sind(x){return Math.sin(x*Math.PI/180);}
function cosd(x){return Math.cos(x*Math.PI/180);}
function atan2d(y,x){return Math.atan2(y,x)*180/Math.PI;}

function keplerDeg(M,e){
  M=norm360(M);
  let E=M+(180/Math.PI)*e*sind(M)*(1+e*cosd(M));
  for(let k=0;k<12;k++){
    const n=E-(E-(180/Math.PI)*e*sind(E)-M)/(1-e*cosd(E));
    if(Math.abs(n-E)<1e-8){E=n;break;}
    E=n;
  }
  return E;
}

function scratchSunBase(date){
  const d=jd(date)-2451543.5;
  const loncorr=-0.0000382394*d;
  const ecl=23.4393-3.563e-7*d;
  const w=282.9404+0.0000470935*d;
  const e=0.01671022-1.151e-9*d;
  const M=356.047+0.9856002585*d;
  const E=keplerDeg(M,e);
  const xv=cosd(E)-e;
  const yv=Math.sqrt(1-e*e)*sind(E);
  const v=atan2d(yv,xv);
  const rs=Math.hypot(xv,yv);
  const lonsun=v+w+loncorr;
  return {d,loncorr,ecl,w,M,rs,xs:rs*cosd(lonsun),ys:rs*sind(lonsun)};
}

function scratchElements(name,d){
  switch(name){
    case "Mercury": return {N:48.33167+3.24587e-5*d,i:7.00487+5e-8*d,w:29.1241+1.01444e-5*d,a:.38709893,e:.20563069+5.59e-10*d,M:168.6562+4.0923344368*d};
    case "Venus":   return {N:76.752+2.4659e-5*d,i:3.39471+2.75e-8*d,w:54.9238+1.38374e-5*d,a:.72333199,e:.00677323+1.302e-9*d,M:48.0052+1.6021302244*d};
    case "Mars":    return {N:49.57854+2.11081e-5*d,i:1.85061+1.78e-8*d,w:286.5016+2.92961e-5*d,a:1.52366232844,e:.09341233+2.516e-9*d,M:18.6021+.5240207766*d};
    case "Jupiter": return {N:100.4542+2.76854e-5*d,i:1.3028+1.557e-7*d,w:273.8777+1.64505e-5*d,a:5.20336289787,e:.04851+4.469e-9*d,M:19.895+.0830853001*d};
    case "Saturn":  return {N:113.6634+2.3898e-5*d,i:2.4886+1.081e-7*d,w:339.3939+2.97661e-5*d,a:9.537070235853,e:.05552+9.499e-9*d,M:316.967+.0334442282*d};
    case "Uranus":  return {N:74.0005+1.3978e-5*d,i:.7733+1.9e-8*d,w:96.6612+3.0565e-5*d,a:19.20120912523+1.55e-8*d,e:.04638+7.45e-9*d,M:142.5905+.011725806*d};
    case "Neptune": return {N:131.7806+3.0173e-5*d,i:1.76917+2.55e-7*d,w:272.8461+6.027e-6*d,a:30.06896340805+3.313e-8*d,e:.0097+2.15e-9*d,M:260.2471+.005995147*d};
  }
}

function scratchPlanetEq(name,date){
  const sun=scratchSunBase(date), d=sun.d;
  const o=scratchElements(name,d);
  const E=keplerDeg(o.M,o.e);
  const xv=o.a*(cosd(E)-o.e);
  const yv=o.a*Math.sqrt(1-o.e*o.e)*sind(E);
  const v=atan2d(yv,xv), r=Math.hypot(xv,yv);

  let xh=r*(cosd(o.N)*cosd(v+o.w)-sind(o.N)*sind(v+o.w)*cosd(o.i));
  let yh=r*(sind(o.N)*cosd(v+o.w)+cosd(o.N)*sind(v+o.w)*cosd(o.i));
  let zh=r*(sind(v+o.w)*sind(o.i));

  let lonecl=atan2d(yh,xh)+sun.loncorr;
  let latecl=atan2d(zh,Math.hypot(xh,yh));

  // Original Scratch perturbations.
  // Important: the original project recomputes xh/yh/zh from corrected
  // longitude/latitude only for Jupiter, Saturn and Uranus.
  const Mj=scratchElements("Jupiter",d).M;
  const Ms=scratchElements("Saturn",d).M;
  let corrected=false;

  if(name==="Jupiter"){
    lonecl += -0.332*sind(2*o.M-5*Ms-67.6)
              -0.056*sind(2*o.M-2*Ms+21)
              +0.042*sind(3*o.M-5*Ms+21)
              -0.036*sind(o.M-2*Ms)
              +0.022*cosd(o.M-Ms)
              +0.023*sind(2*o.M-3*Ms+52)
              -0.016*sind(o.M-5*Ms-69);
    corrected=true;
  }else if(name==="Saturn"){
    lonecl += 0.812*sind(2*Mj-5*o.M-67.6)
              -0.229*cosd(2*Mj-4*o.M-2)
              +0.119*sind(Mj-2*o.M-3)
              +0.046*sind(2*Mj-6*o.M-69)
              +0.014*sind(Mj-3*o.M+32);
    latecl += -0.020*cosd(2*Mj-4*o.M-2)
              +0.018*sind(2*Mj-6*o.M-49);
    corrected=true;
  }else if(name==="Uranus"){
    lonecl += 0.040*sind(Ms-2*o.M+6)
              +0.035*sind(Ms-3*o.M+33)
              -0.015*sind(Mj-o.M+20);
    corrected=true;
  }

  if(corrected){
    xh=r*cosd(lonecl)*cosd(latecl);
    yh=r*sind(lonecl)*cosd(latecl);
    zh=r*sind(latecl);
  }

  const xe=xh+sun.xs;
  const ye=(yh+sun.ys)*cosd(sun.ecl)-zh*sind(sun.ecl);
  const ze=(yh+sun.ys)*sind(sun.ecl)+zh*cosd(sun.ecl);
  return {ra:norm360(atan2d(ye,xe)),dec:atan2d(ze,Math.hypot(xe,ye))};
}

function scratchMoonEq(date){
  const sun=scratchSunBase(date), d=sun.d;
  const N=125.1228-0.0529538083*d;
  const i=5.1454;
  const w=318.0634+0.1643573223*d;
  const a=60.2666;
  const e=0.0549;
  const M=115.3654+13.0649929509*d;
  const E=keplerDeg(M,e);
  const xv=a*(cosd(E)-e);
  const yv=a*Math.sqrt(1-e*e)*sind(E);
  const v=atan2d(yv,xv);
  let r=Math.hypot(xv,yv);

  let xh=r*(cosd(N)*cosd(v+w)-sind(N)*sind(v+w)*cosd(i));
  let yh=r*(sind(N)*cosd(v+w)+cosd(N)*sind(v+w)*cosd(i));
  let zh=r*sind(v+w)*sind(i);

  let lonecl=atan2d(yh,xh)+sun.loncorr;
  let latecl=atan2d(zh,Math.hypot(xh,yh));
  const L=M+w+N;
  const D=L-(sun.M+sun.w);
  const F=L-N;

  // Lunar perturbations from the original Scratch project.
  lonecl += -1.274*sind(M-2*D)
            +0.658*sind(2*D)
            -0.186*sind(sun.M)
            -0.059*sind(2*M-2*D)
            -0.057*sind(M-2*D+sun.M)
            +0.053*sind(M+2*D)
            +0.046*sind(2*D-sun.M)
            +0.041*sind(M-sun.M)
            -0.035*sind(D)
            -0.031*sind(M+sun.M)
            -0.015*sind(2*F-2*D)
            +0.011*sind(M-4*D);
  latecl += -0.173*sind(F-2*D)
             -0.055*sind(M-F-2*D)
             -0.046*sind(M+F-2*D)
             +0.033*sind(F+2*D)
             +0.017*sind(2*M+F);
  r += -0.58*cosd(M-2*D)-0.46*cosd(2*D);

  xh=r*cosd(lonecl)*cosd(latecl);
  yh=r*sind(lonecl)*cosd(latecl);
  zh=r*sind(latecl);

  const xe=xh;
  const ye=yh*cosd(sun.ecl)-zh*sind(sun.ecl);
  const ze=yh*sind(sun.ecl)+zh*cosd(sun.ecl);
  return {ra:norm360(atan2d(ye,xe)),dec:atan2d(ze,Math.hypot(xe,ye))};
}

function bodyEquatorial(body,date){
  return body.eq ? body.eq(date) : scratchPlanetEq(body.key,date);
}

function verifyAstronomy(now){
  const pol=stars.find(isPolaris);
  const dip=stars.filter(isBigDipper);
  if(!pol || dip.length<7) return {ok:false,msg:"基準星データ不足"};
  const ph=horizontal(pol.ra,pol.dec,now);
  const dh=dip.map(s=>({name:s.en,...horizontal(s.ra,s.dec,now)}));
  // Polaris altitude should remain close to observer latitude.
  const polOK=Math.abs(ph.alt-lat)<1.5;
  // This is a data/geometry invariant, not an assumption that the Dipper
  // must always be above horizon at every date.
  return {ok:polOK,pol:ph,dip:dh};
}

function beginFrame(){
  // Hard-reset the Canvas before every frame.
  // clearRect must run in backing-store pixel coordinates, not in the DPR
  // transformed CSS coordinate system. This prevents Safari from retaining
  // old pixels / compositor tiles while the phone is moving.
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="copy";
  ctx.fillStyle="#02050b";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();

  // All sky drawing below uses CSS-pixel coordinates.
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
}

function draw(){
  if(!enabled) return;
  dirty=false;
  const now=new Date();
  beginFrame();

  // Constellation lines. Nothing below astronomical altitude 0° is allowed
  // to appear. Segments crossing the horizon are clipped exactly at alt=0.
  ctx.strokeStyle="rgba(112,146,202,.45)";
  ctx.lineWidth=.75;
  ctx.beginPath();
  for(const q of lines){
    let h1=horizontal(q.ra1,q.dec1,now);
    let h2=horizontal(q.ra2,q.dec2,now);

    if(h1.alt<0 && h2.alt<0) continue;

    // unwrap azimuth across 0/360 for interpolation
    let az1=h1.az, az2=h2.az;
    let d=((az2-az1+540)%360)-180;
    az2=az1+d;

    // If one endpoint is underground, interpolate the crossing at altitude 0.
    if(h1.alt<0 || h2.alt<0){
      const t=(0-h1.alt)/(h2.alt-h1.alt);
      const azCross=norm360(az1+(az2-az1)*t);
      if(h1.alt<0) h1={az:azCross,alt:0};
      else h2={az:azCross,alt:0};
    }

    const a=project(h1.az,h1.alt);
    const b=project(h2.az,h2.alt);
    if(a&&b){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
  }
  ctx.stroke();

  // Constellation names (v7).  Draw these as a quiet background layer:
  // individual stars and their proper-name labels are drawn afterwards and
  // therefore remain visually dominant.  Only the nearest visible labels are
  // shown to avoid turning a phone screen into a wall of text.
  {
    const candidates=[];
    for(const c of constellationCenters){
      const h=horizontal(c.ra,c.dec,now);
      if(h.alt<0) continue;
      const p=project(h.az,h.alt);
      if(!p) continue;
      const d2=(p.x-W/2)**2+(p.y-H/2)**2;
      candidates.push({c,p,d2});
    }
    candidates.sort((a,b)=>a.d2-b.d2 || b.c.count-a.c.count);
    const budget=W<H ? 8 : 12;
    const used=[];
    reserveDomRect(used,document.getElementById("toolbar"),6);
    reserveDomRect(used,document.getElementById("info"),6);
    reserveDomRect(used,document.getElementById("debug"),6);
    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.font="700 14px -apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif";
    let placed=0;
    for(const q of candidates){
      if(placed>=budget) break;
      const label=q.c.name;
      const tw=Math.ceil(ctx.measureText(label).width), th=18;
      const trials=[[0,0],[0,-22],[0,22],[-tw*.35,0],[tw*.35,0]];
      let chosen=null;
      for(const [dx,dy] of trials){
        const x=q.p.x+dx, y=q.p.y+dy;
        const box={x:x-tw/2-5,y:y-th/2-3,w:tw+10,h:th+6};
        if(box.x<5||box.y<5||box.x+box.w>W-5||box.y+box.h>H-5) continue;
        if(used.some(o=>rectsOverlap(box,o,5))) continue;
        chosen={x,y,box}; break;
      }
      if(!chosen) continue;
      ctx.lineWidth=4;
      ctx.lineJoin="round";
      ctx.strokeStyle="rgba(2,5,11,.82)";
      ctx.strokeText(label,chosen.x,chosen.y);
      ctx.fillStyle="rgba(135,171,222,.68)";
      ctx.fillText(label,chosen.x,chosen.y);
      used.push(chosen.box);
      placed++;
    }
    ctx.restore();
  }

  // stars + named-star label candidates
  const starLabelCandidates=[];
  for(const s of stars){
    if(s.mag>5.2) continue;
    const h=horizontal(s.ra,s.dec,now);
    // Physical visibility invariant: stars below the horizon are never drawn.
    if(h.alt < 0) continue;
    const p=project(h.az,h.alt);
    if(!p) continue;
    const r=Math.max(.65,Math.min(3.0,2.5-.32*s.mag));
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle=s.mag<1.2?"#fffdf4":"#e8eefb";ctx.fill();

    // Keep Polaris ring as a calibration marker; its text is handled by the
    // common label engine so it cannot collide with other star names.
    if(isPolaris(s)){
      ctx.save();
      ctx.strokeStyle="rgba(255,255,255,.9)";
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(properStarName(s) && s.mag<=3.05){
      starLabelCandidates.push({s,h,p});
    }
  }


  // Moon + planets from the original Scratch orbital model.
  // Same physical horizon rule as the stars: altitude below 0° is never drawn.
  const planetLabelRects=[];
  for(const body of SKY_BODIES){
    const eq=bodyEquatorial(body,now);
    const h=horizontal(eq.ra,eq.dec,now);
    if(h.alt<0) continue;
    const p=project(h.az,h.alt);
    if(!p) continue;

    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x,p.y,body.radius,0,Math.PI*2);
    ctx.fillStyle=body.key==="Moon" ? "#e8e5d8" :
                  body.key==="Mars" ? "#e7a07d" :
                  body.key==="Venus" ? "#fff1c2" :
                  "#d9e2f0";
    ctx.fill();

    // A thin ring keeps planets distinguishable from catalog stars.
    ctx.strokeStyle="rgba(255,255,255,.65)";
    ctx.lineWidth=1;
    ctx.stroke();

    ctx.fillStyle="#ffffff";
    ctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";
    const bodyLabel=`${body.symbol} ${body.name}`;
    const bodyX=p.x+body.radius+5, bodyY=p.y+4;
    ctx.fillText(bodyLabel,bodyX,bodyY);
    const bodyW=Math.ceil(ctx.measureText(bodyLabel).width);
    planetLabelRects.push({x:bodyX-2,y:bodyY-13,w:bodyW+4,h:17});
    ctx.restore();
  }

  // North celestial pole reference (Dec +90°): altitude equals observer latitude.
  const ncp=horizontal(0,90,now);
  const np=project(ncp.az,ncp.alt);
  if(np){
    ctx.save();
    ctx.strokeStyle="rgba(255,210,120,.75)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(np.x-6,np.y);ctx.lineTo(np.x+6,np.y);
    ctx.moveTo(np.x,np.y-6);ctx.lineTo(np.x,np.y+6);
    ctx.stroke();
    ctx.fillStyle="rgba(255,220,150,.9)";
    ctx.font="11px -apple-system,BlinkMacSystemFont,sans-serif";
    ctx.fillText("天の北極",np.x+8,np.y+4);
    ctx.restore();
  }

  // True astronomical horizon: altitude = 0°.  Under perspective projection
  // it is generally curved / off-screen, so sample it on the celestial sphere.
  ctx.save();
  ctx.strokeStyle="rgba(190,200,215,.32)";
  ctx.lineWidth=1;
  ctx.beginPath();
  let pen=false, labelPoint=null;
  for(let az=0;az<=360;az+=2){
    const hp=project(az,0);
    if(hp){
      if(!pen){ctx.moveTo(hp.x,hp.y);pen=true;}
      else ctx.lineTo(hp.x,hp.y);
      if(!labelPoint && hp.x>12 && hp.x<W-120 && hp.y>18 && hp.y<H-18) labelPoint=hp;
    }else pen=false;
  }
  ctx.stroke();
  if(labelPoint){
    ctx.fillStyle="rgba(220,225,235,.7)";
    ctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";
    ctx.fillText("地平線  高度0°",labelPoint.x,labelPoint.y-7);
  }
  ctx.restore();

  // Cardinal markers are a deliberate self-check: when the phone is level and
  // upright, the horizon must be horizontal and N/E/S/W must move continuously.
  ctx.save();
  ctx.font="600 13px -apple-system,BlinkMacSystemFont,sans-serif";
  ctx.fillStyle="rgba(235,240,250,.78)";
  for(const [az,label] of [[0,"N"],[90,"E"],[180,"S"],[270,"W"]]){
    const cp=project(az,0);
    if(cp) ctx.fillText(label,cp.x+5,cp.y-5);
  }
  ctx.restore();

  // Proper star names: bright stars always get first priority; 2-3 mag names
  // are added only while there is enough uncluttered screen space.
  drawAdaptiveStarLabels(starLabelCandidates,planetLabelRects);

  {
    const pol=stars.find(isPolaris);
    const above=SKY_BODIES.map(body=>{
      const eq=bodyEquatorial(body,now);
      const h=horizontal(eq.ra,eq.dec,now);
      return {name:body.name,az:h.az,alt:h.alt};
    }).filter(b=>b.alt>=0);
    const bodyText=above.length
      ? above.map(b=>`${b.name}${Math.round(b.alt)}°`).join(" ")
      : "月・惑星なし";
    if(pol){
      const ph=horizontal(pol.ra,pol.dec,now);
      info.textContent=`視線 ${Math.round(heading)}°/${Math.round(pitch)}°　地上: ${bodyText}`;
    }else{
      info.textContent=`方位 ${Math.round(heading)}° 高度 ${Math.round(pitch)}°　地上: ${bodyText}`;
    }
  }
}
function loop(t){
  // Max ~20 FPS while moving; almost no work when still.
  if(enabled && dirty && t-lastDraw>45){lastDraw=t;draw();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Refresh only because real sky slowly changes.
setInterval(()=>{dirty=true;},30000);

function deg2rad(d){ return d*Math.PI/180; }
function rad2deg(r){ return r*180/Math.PI; }
function norm180(x){ x=(x+180)%360; if(x<0)x+=360; return x-180; }

// W3C Device Orientation uses intrinsic Z-X'-Y'' rotations. The device frame is
// x=screen right, y=screen top in natural portrait, z=out through the display.
// This function maps a DEVICE vector into local Earth ENU (east,north,up).
function deviceVectorToEarth(vx,vy,vz,alpha,beta,gamma){
  const a=deg2rad(alpha||0), b=deg2rad(beta||0), g=deg2rad(gamma||0);

  // Intrinsic Z-X'-Y'' is equivalent to Rz(alpha) * Rx(beta) * Ry(gamma)
  // when mapping device-frame vectors into the Earth frame.
  let x1 =  Math.cos(g)*vx + Math.sin(g)*vz;
  let y1 =  vy;
  let z1 = -Math.sin(g)*vx + Math.cos(g)*vz;

  let x2 = x1;
  let y2 = Math.cos(b)*y1 - Math.sin(b)*z1;
  let z2 = Math.sin(b)*y1 + Math.cos(b)*z1;

  return {
    x: Math.cos(a)*x2 - Math.sin(a)*y2,
    y: Math.sin(a)*x2 + Math.cos(a)*y2,
    z: z2
  };
}

function azimuthOf(v){ return norm360(rad2deg(Math.atan2(v.x,v.y))); }
function vlen(v){return Math.hypot(v.x,v.y,v.z);}
function vnorm(v){ const n=vlen(v)||1; return {x:v.x/n,y:v.y/n,z:v.z/n}; }
function vcross(a,b){ return {x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}; }
function vmix(a,b,f){ return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,z:a.z+(b.z-a.z)*f}; }
function vneg(v){return {x:-v.x,y:-v.y,z:-v.z};}

let smoothForward=null, smoothRight=null;

function currentScreenAngle(){
  let a=0;
  if(window.screen && screen.orientation && Number.isFinite(screen.orientation.angle)) a=screen.orientation.angle;
  else if(typeof window.orientation==='number') a=window.orientation;
  a=norm360(Math.round(a/90)*90);

  // Safari can briefly report the old orientation angle while the visual viewport
  // has already switched. Never apply a 90° screen roll to a portrait viewport.
  const portrait=H>=W;
  if(portrait && (a===90 || a===270)) a=0;
  if(!portrait && (a===0 || a===180) && typeof window.orientation==='number'){
    const wo=norm360(Math.round(window.orientation/90)*90);
    if(wo===90 || wo===270) a=wo;
  }
  return a;
}

function compassIsUsable(e){
  if(typeof e.webkitCompassHeading!=="number" || e.webkitCompassHeading<0) return false;
  // Negative accuracy means invalid. Large positive accuracy is noisy but still
  // preferable to an arbitrary relative alpha, so only reject extreme values.
  if(typeof e.webkitCompassAccuracy==="number" && e.webkitCompassAccuracy<0) return false;
  return true;
}

function circularMeanDeg(values){
  if(!values.length) return 0;
  let sx=0, sy=0;
  for(const d of values){ const r=deg2rad(d); sx+=Math.cos(r); sy+=Math.sin(r); }
  return rad2deg(Math.atan2(sy,sx));
}

function buildRawCameraBasis(e){
  const eventAlpha=norm360(e.alpha||0);
  let alpha=eventAlpha;
  let source="relative";

  // IMPORTANT: webkitCompassHeading is deliberately NOT blended every frame.
  // On iPhone it can change sharply as the device is pitched even though the
  // rear camera has not swept through that much azimuth.  Re-anchoring alpha on
  // every event caused the observed 161° -> 132° -> 2° jump at only 48° altitude.
  //
  // Instead, collect a handful of samples immediately after gyro start while
  // the camera is away from the zenith, lock one yaw offset, and thereafter let
  // the W3C 3-D orientation matrix carry the motion continuously.
  if(e.absolute===true && !compassIsUsable(e)){
    source="absolute";
  }else if(compassAlphaOffset!==null){
    alpha=norm360(eventAlpha+compassAlphaOffset);
    source="locked";
  }else if(compassIsUsable(e)){
    const rawForward=vnorm(deviceVectorToEarth(0,0,-1,eventAlpha,e.beta,e.gamma));
    const horizontal=Math.hypot(rawForward.x,rawForward.y);
    if(!compassCalibrationStarted) compassCalibrationStarted=performance.now();

    // Never calibrate near zenith/nadir, where azimuth is poorly conditioned.
    if(horizontal>0.55){
      const absoluteAlpha=norm360(360-e.webkitCompassHeading);
      compassCalibration.push(norm180(absoluteAlpha-eventAlpha));
      if(compassCalibration.length>12) compassCalibration.shift();
    }

    const age=performance.now()-compassCalibrationStarted;
    if(compassCalibration.length>=6 || (age>650 && compassCalibration.length>=2)){
      compassAlphaOffset=norm180(circularMeanDeg(compassCalibration));
      alpha=norm360(eventAlpha+compassAlphaOffset);
      source="locked";
    }else{
      // Do not publish a falsely absolute sky while calibration is incomplete.
      return null;
    }
  }

  // Natural device axes and rear-camera forward vector.
  const devX=deviceVectorToEarth(1,0,0,alpha,e.beta,e.gamma);
  const devY=deviceVectorToEarth(0,1,0,alpha,e.beta,e.gamma);
  const forward=vnorm(deviceVectorToEarth(0,0,-1,alpha,e.beta,e.gamma));

  // Convert natural portrait axes into CURRENT screen axes. For +90° screen
  // rotation, current screen-right is natural +Y and screen-up is natural -X.
  const o=deg2rad(currentScreenAngle()), c=Math.cos(o), sn=Math.sin(o);
  let right=vnorm({x:c*devX.x+sn*devY.x,y:c*devX.y+sn*devY.y,z:c*devX.z+sn*devY.z});
  const measuredUp=vnorm({x:-sn*devX.x+c*devY.x,y:-sn*devX.y+c*devY.y,z:-sn*devX.z+c*devY.z});

  // Remove numerical error and construct screen-up with the correct handedness.
  const d=dot3(right,forward);
  right=vnorm({x:right.x-d*forward.x,y:right.y-d*forward.y,z:right.z-d*forward.z});
  let up=vnorm(vcross(right,forward)); // east x north = up for a level north view
  if(dot3(up,measuredUp)<0){ right=vneg(right); up=vneg(up); }

  return {forward,right,up,source,alpha,screenAngle:currentScreenAngle()};
}

function cameraRollDeg(b){
  const worldUp={x:0,y:0,z:1};
  let levelRight=vcross(b.forward,worldUp);
  if(vlen(levelRight)<0.05) return null; // roll is singular exactly at zenith/nadir
  levelRight=vnorm(levelRight);
  const levelUp=vnorm(vcross(levelRight,b.forward));
  return rad2deg(Math.atan2(dot3(b.up,levelRight),dot3(b.up,levelUp)));
}

function setOrientation(e){
  if(!enabled) return;
  if(typeof e.alpha!=="number" || typeof e.beta!=="number" || typeof e.gamma!=="number") return;

  const raw=buildRawCameraBasis(e);
  if(!raw){
    sensorSource="calibrating";
    status.textContent="初期方位を校正中… スマホを正面付近で一瞬静止してください";
    return;
  }
  const f=0.32;
  smoothForward=smoothForward ? vnorm(vmix(smoothForward,raw.forward,f)) : raw.forward;
  smoothRight=smoothRight ? vnorm(vmix(smoothRight,raw.right,f)) : raw.right;

  // Re-orthogonalize after smoothing; right x forward is screen up in ENU.
  const p=dot3(smoothRight,smoothForward);
  smoothRight=vnorm({x:smoothRight.x-p*smoothForward.x,y:smoothRight.y-p*smoothForward.y,z:smoothRight.z-p*smoothForward.z});
  let smoothUp=vnorm(vcross(smoothRight,smoothForward));
  if(dot3(smoothUp,raw.up)<0){ smoothRight=vneg(smoothRight); smoothUp=vneg(smoothUp); }

  cameraBasis={forward:smoothForward,right:smoothRight,up:smoothUp};
  heading=azimuthOf(smoothForward);
  pitch=rad2deg(Math.asin(Math.max(-1,Math.min(1,smoothForward.z))));
  sensorSource=raw.source;
  sensorActive=true;
  dirty=true;

  const roll=cameraRollDeg(cameraBasis);
  const rollText=roll===null?"天頂":`${Math.round(roll)}°`;
  const srcText=raw.source==="locked"?"方位校正LOCK v7":raw.source==="absolute"?"絶対方位 v7":"相対方位 v7";
  status.textContent=`方位 ${Math.round(heading)}° / 高度 ${Math.round(pitch)}° / 傾き ${rollText}　${srcText}`;
}

// Deterministic diagnostic hook used by the build-time tests. It does not start
// sensors and has no effect on normal operation.
function debugPose({alpha=0,beta=0,gamma=0,compassHeading=null,screenAngle=0}={}){
  const savedOffset=compassAlphaOffset, savedCal=compassCalibration, savedStarted=compassCalibrationStarted;
  const savedW=W,savedH=H;
  W=390;H=844;
  // Diagnostic path bypasses the start-up sample collector.
  compassAlphaOffset=compassHeading===null?null:norm180((360-compassHeading)-norm360(alpha));
  compassCalibration=[]; compassCalibrationStarted=0;
  const fake={alpha,beta,gamma,absolute:compassHeading===null,webkitCompassHeading:compassHeading,webkitCompassAccuracy:5};
  let b=buildRawCameraBasis(fake);
  compassAlphaOffset=savedOffset; compassCalibration=savedCal; compassCalibrationStarted=savedStarted; W=savedW;H=savedH;
  const h=azimuthOf(b.forward), p=rad2deg(Math.asin(Math.max(-1,Math.min(1,b.forward.z))));
  return {heading:h,pitch:p,forward:b.forward,right:b.right,up:b.up,source:b.source};
}

async function startSensors(){
  status.textContent="センサー許可を確認中…";
  try{
    enabled=true;
    sensorActive=false; cameraBasis=null; compassAlphaOffset=null; sensorSource="";
    compassCalibration=[]; compassCalibrationStarted=0;
    smoothForward=null; smoothRight=null;
    resize(); dirty=true;
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted"){enabled=false;status.textContent="方向センサーが許可されませんでした";return false;}
    }
    window.removeEventListener("deviceorientation",setOrientation,true);
    window.removeEventListener("deviceorientationabsolute",setOrientation,true);
    window.addEventListener("deviceorientation",setOrientation,true);
    startBtn.textContent="ジャイロON";
    status.textContent="iPhoneを空へ向けてください";
    setTimeout(()=>{if(enabled && !sensorActive)status.textContent="センサー値が届きません。Safariのモーション設定を確認してください";},1800);
    return true;
  }catch(err){enabled=false;status.textContent="センサー開始エラー: "+(err.message||err);return false;}
}
function stopSensors(){
  enabled=false; sensorActive=false; cameraBasis=null; smoothForward=null; smoothRight=null;
  compassAlphaOffset=null; compassCalibration=[]; compassCalibrationStarted=0;
  window.removeEventListener("deviceorientation",setOrientation,true);
  window.removeEventListener("deviceorientationabsolute",setOrientation,true);
  status.textContent="ジャイロ停止中";
}
function setLocation(la,lo){
  la=Number(la); lo=Number(lo);
  if(Number.isFinite(la)&&Number.isFinite(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180){
    lat=la; lon=lo; dirty=true; return true;
  }
  return false;
}
window.GyroSky={start:startSensors,stop:stopSensors,setLocation,refresh:()=>{resize();dirty=true;},debugPose,get active(){return enabled;}};
})();

</script>
