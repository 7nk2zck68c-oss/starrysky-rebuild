function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function fail(err) {
  console.error(err);
  const status = document.getElementById('status');
  if (status) status.style.display = 'none';
  const box = document.getElementById('error');
  box.style.display = 'block';
  box.textContent = '起動できませんでした。\n\n' +
    'インターネット接続を確認してください（Scratch互換ランタイムの読み込みに必要です）。\n\n' +
    '詳細: ' + (err && err.message ? err.message : String(err));
}

async function boot() {
  try {
    if (!window.Scaffolding || !Scaffolding.Scaffolding) {
      throw new Error('Scratch互換ランタイムを読み込めませんでした');
    }
    const status = document.getElementById('status');
    const scaffolding = new Scaffolding.Scaffolding();

    // Scratch原本のステージ仕様をそのまま使用。
    scaffolding.width = 480;
    scaffolding.height = 360;
    scaffolding.resizeMode = 'preserve-ratio';
    scaffolding.editableLists = false;
    scaffolding.shouldConnectPeripherals = true;
    scaffolding.usePackagedRuntime = false;
    scaffolding.setup();
    scaffolding.appendTo(document.getElementById('project'));

    status.textContent = 'Scratch原本を展開中…';
    const projectBytes = base64ToBytes(PROJECT_BASE64);
    await scaffolding.loadProject(projectBytes);

    // Scratchで緑の旗を押したのと同じ状態から開始。
    status.style.display = 'none';
    scaffolding.greenFlag();

    // デバッグ/比較用。画面挙動には影響しない。
    window.__starrySkyScaffolding = scaffolding;
    window.__originalProjectSHA256 = ORIGINAL_SHA256;
  } catch (err) {
    fail(err);
  }
}

window.addEventListener('load', boot, {once:true});
window.addEventListener('resize', () => {
  const s = window.__starrySkyScaffolding;
  if (s && s.relayout) s.relayout();
});
</script>
